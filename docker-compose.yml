version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=sqlite:///mmssnake.db
      - YAMPI_API_KEY=${YAMPI_API_KEY}
      - YAMPI_SECRET_KEY=${YAMPI_SECRET_KEY}
      - YAMPI_BASE_URL=${YAMPI_BASE_URL}
      - LOOTER_API=${LOOTER_API}
      - INTAGRAM230_API=${INTAGRAM230_API}
      - YAMPI_WEBHOOK_SECRET=${YAMPI_WEBHOOK_SECRET}
      - MACHINESMM_API_KEY=${MACHINESMM_API_KEY}
      - WORLDSMM_API_KEY=${WORLDSMM_API_KEY}
      - SMMCLOUDUK_API_KEY=${SMMCLOUDUK_API_KEY}
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token eyJhIjoiNWM3OWQ0NGVmY2E0MjBhMmJiNmJlOWQxNTg1MjNlMjAiLCJ0IjoiMDQ2YWZiNTktMjRkMy00NDViLThhMWQtOTBkYjBkZTY0Njk4IiwicyI6IlltRTRPRFJrTVRFdFlqSTFPQzAwWmpoaUxUbGlOMkl0WlRrMU1EUTBOalV6WVdNMiJ9
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped